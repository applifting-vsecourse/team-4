services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: akcio
      POSTGRES_PASSWORD: akcio
      POSTGRES_DB: akcio
    ports:
      - 5433:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akcio -d akcio']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Object storage for event photos (F55); the backend creates the bucket.
  storage:
    image: bitnamilegacy/minio:2025.7.23
    restart: always
    environment:
      MINIO_ROOT_USER: akcio
      MINIO_ROOT_PASSWORD: akcio-secret
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - storage-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  storage-data:
