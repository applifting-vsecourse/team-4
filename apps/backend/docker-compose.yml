services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: akcio
      POSTGRES_PASSWORD: akcio
      POSTGRES_DB: akcio
    ports:
      - 5433:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U akcio -d akcio']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
