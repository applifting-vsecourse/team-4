packages:
  - apps/*

catalogs:
  default:
    '@types/node': ^20.19.43
    prettier: ^3.9.6
    react-hook-form: ^7.85.0
    typescript: ^5.9.3
    zod: ^4.6.7
  lint:
    '@eslint/compat': ^2.1.0
    '@eslint/js': ^10.0.1
    '@shadcn/lint': ^0.2.3
    '@tanstack/eslint-plugin-query': ^5.101.4
    '@tanstack/eslint-plugin-router': ^1.162.0
    '@typescript-eslint/eslint-plugin': ^8.67.0
    '@typescript-eslint/parser': ^8.67.0
    '@vitest/eslint-plugin': ^1.6.16
    eslint: ^10.8.1
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-import: ^2.32.0
    eslint-plugin-jsx-a11y: ^6.10.2
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-turbo: ^2.9.6
    globals: ^16.5.0
    typescript-eslint: ^8.67.0
  react19:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    react: ^19.2.8
    react-dom: ^19.2.8

# Security audit (#166): patched versions of transitive dependencies that their
# parents don't require yet. Remove an entry once its parent requires the fix.
overrides:
  # Optional peers of better-auth; akc.io uses neither Next.js nor MySQL.
  'better-auth>next': '-'
  'better-auth>mysql2': '-'
  '@nestjs/platform-express>multer': ^2.5.0
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'proxy-addr@>=1.1.0 <2.0.8': ^2.0.8
  'qs@<6.16.1': ^6.16.1
  'engine.io@>=6.6.0 <6.6.10': ^6.6.10
  'source-map-js@>=1.0.0 <1.2.2': ^1.2.2
  # Mostly dev tooling (Nest CLI, Jest, ESLint, npm-run-all); glob also reaches
  # rimraf and react-email. These majors are API-compatible for their consumers.
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'brace-expansion@<1.1.21': ^1.1.21
  'shell-quote@>=1.8.4 <1.11.0': ^1.11.0
