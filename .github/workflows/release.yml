name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

# Versions are computed from the latest tag, so releases must not race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/release/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COURSE_DOMAIN: vsepractical.applifting.dev
