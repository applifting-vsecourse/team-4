name: Merge stack

# `/merge-stack` on a PR of a stack merges the whole stack, bottom to top. The
# command, its author and the stack are read back from the API; nothing here
# runs PR code. Merges use PROJECT_AUTOMATION_TOKEN (a person's or app's token)
# so that deploy, release and the delivery check run for them; the workflow
# token's pushes would trigger none of those.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

# One stack at a time: a second command waits instead of racing the first.
concurrency:
  group: stack-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge stack
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/merge-stack') &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["darebakdavca","rmnskb","MatejKrones"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    # Each retarget waits for a fresh delivery check, up to ten minutes per PR.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/delivery/stack-merge-command.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_AUTOMATION_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
