name: Dependency update merge

# Dependabot PRs merge on their own once a code owner approved them and the
# required checks pass (#499): this only switches GitHub auto-merge on, and
# the merge queue does the rest. The ruleset still requires the approval.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A personal token, not GITHUB_TOKEN: a merge started by GITHUB_TOKEN does
      # not run the CI, deploy and release workflows on main.
      - run: gh pr merge --auto --merge "$PR" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
