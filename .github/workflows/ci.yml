name: CI

on:
  pull_request:
  # The merge queue runs the required checks, with the whole E2E suite, on the
  # merge result before it reaches main (#499).
  merge_group:
  push:
    branches: [main]
  # A manual run on any branch runs the whole E2E suite.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Test repository scripts
        run: pnpm scripts:test
      - name: Format check
        run: pnpm format:check
      - name: Lint backend
        run: pnpm backend lint:check
      - name: Lint frontend
        run: pnpm frontend lint:check
      - name: Type-check frontend
        run: pnpm frontend type-check
      - name: Test backend
        run: pnpm backend test
      - name: Test frontend
        run: pnpm frontend test:ci
      - name: Build backend
        run: pnpm backend build
      - name: Build frontend
        run: pnpm frontend build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akcio
          POSTGRES_PASSWORD: akcio
          POSTGRES_DB: akcio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akcio -d akcio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://akcio:akcio@localhost:5432/akcio_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Apply migrations to clean database
        run: pnpm backend migrate
      - name: Test database constraints
        run: pnpm backend test:db --passWithNoTests=false

  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      # Every story renders in Chromium with its play checks and the a11y check.
      - name: Test frontend stories
        run: pnpm frontend test:stories

  # Which E2E specs this change needs: on a PR the affected ones, otherwise
  # (merge queue, main, manual run) the whole suite. The summary says why.
  e2e-select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      specs: ${{ steps.select.outputs.specs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: select
        name: Select E2E specs
        run: node scripts/e2e/affected.mjs --list
        env:
          E2E_BASE: ${{ github.event.pull_request.base.sha }}
          E2E_ALL: ${{ github.event_name != 'pull_request' }}

  e2e:
    needs: e2e-select
    if: needs.e2e-select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akcio
          POSTGRES_PASSWORD: akcio
          POSTGRES_DB: akcio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akcio -d akcio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://akcio:akcio@localhost:5432/akcio_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Apply migrations to clean database
        run: pnpm backend migrate
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      # Each shard has its own database and servers. @demo walkthroughs stay local.
      # Only a partial selection may leave a shard empty; the whole suite never.
      - name: End-to-end tests (shard ${{ matrix.shard }}/4)
        env:
          E2E_SPECS: ${{ needs.e2e-select.outputs.specs }}
          EMPTY: ${{ needs.e2e-select.outputs.mode == 'some' && '--pass-with-no-tests' || '' }}
          SHARD: ${{ matrix.shard }}
        # E2E_SPECS is a space-separated list of e2e/*.spec.ts paths; empty runs all.
        run: |
          read -ra specs <<< "$E2E_SPECS"
          read -ra extra <<< "$EMPTY"
          pnpm --filter frontend exec playwright test "${specs[@]}" \
            --grep-invert @demo --shard="$SHARD/4" "${extra[@]}"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}-${{ matrix.shard }}
          path: apps/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The one required check. Every lane must pass; E2E may only be skipped when
  # the selection found nothing to run.
  verify:
    needs: [checks, database, stories, e2e-select, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          E2E: ${{ needs.e2e.result }}
          MODE: ${{ needs.e2e-select.outputs.mode }}
        run: |
          echo "Lanes: $RESULTS; E2E selection: $MODE"
          # A skipped E2E lane passes only when the selection found nothing to run.
          failed=$(echo "$RESULTS" | jq --arg e2e "$E2E" --arg mode "$MODE" \
            '[.[] | select(. != "success")] | length - (if $e2e == "skipped" and $mode == "none" then 1 else 0 end)')
          if [ "$failed" -gt 0 ]; then
            echo "A required CI lane did not pass."
            exit 1
          fi
