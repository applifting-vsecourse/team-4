name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Test review and merge gates
        run: pnpm agent-review:test
      - name: Test local QA preparation
        run: pnpm qa:test
      - name: Format check
        run: pnpm format:check
      - name: Lint backend
        run: pnpm backend lint:check
      - name: Lint frontend
        run: pnpm frontend lint:check
      - name: Type-check frontend
        run: pnpm frontend type-check
      - name: Test backend
        run: pnpm backend test
      - name: Test frontend
        run: pnpm frontend test:ci
      - name: Build backend
        run: pnpm backend build
      - name: Build frontend
        run: pnpm frontend build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akcio
          POSTGRES_PASSWORD: akcio
          POSTGRES_DB: akcio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akcio -d akcio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://akcio:akcio@localhost:5432/akcio_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Apply migrations to clean database
        run: pnpm backend migrate
      - name: Test database constraints
        run: pnpm backend test:db --passWithNoTests=false

  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      # Every story renders in Chromium with its play checks and the a11y check.
      - name: Test frontend stories
        run: pnpm frontend test:stories

  # Child PRs into an integration/ feature branch integrate FE and BE later, so they skip E2E.
  # verify then fails for them, which keeps a skipped lane from passing main.
  e2e:
    if: ${{ !startsWith(github.base_ref, 'integration/') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akcio
          POSTGRES_PASSWORD: akcio
          POSTGRES_DB: akcio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akcio -d akcio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://akcio:akcio@localhost:5432/akcio_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create env files
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm backend prisma:generate
      - name: Apply migrations to clean database
        run: pnpm backend migrate
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      # Keep the end-to-end regression suite here; @demo walkthroughs remain runnable locally.
      - name: End-to-end tests
        run: pnpm frontend test:e2e:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: apps/frontend/playwright-report
          if-no-files-found: error
          retention-days: 7

  # Branch protection requires verify. A failed or skipped lane must fail it.
  verify:
    needs: [checks, database, stories, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          CHECKS: ${{ needs.checks.result }}
          DATABASE: ${{ needs.database.result }}
          STORIES: ${{ needs.stories.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          for result in "$CHECKS" "$DATABASE" "$STORIES" "$E2E"; do
            if [ "$result" != success ]; then
              echo "CI lane finished with: $result"
              exit 1
            fi
          done
