name: Delivery stage enforcement

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Agent code review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: delivery-stages
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute PR code with a write token. Reviews are polled from main.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/delivery/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
