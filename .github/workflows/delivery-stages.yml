name: Delivery stage enforcement

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  # Reconcile existing synthetic checks as well as publishing commit statuses.
  checks: write
  statuses: write

concurrency:
  group: delivery-stages
  cancel-in-progress: false

jobs:
  enforce:
    name: Reconcile delivery stages
    if: github.event_name != 'issue_comment' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute PR code with a write token. Reviews are polled from main.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/delivery/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
