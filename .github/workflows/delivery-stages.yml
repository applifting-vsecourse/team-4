name: Delivery stage enforcement

on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Agent code review]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  # Reconcile existing synthetic checks as well as publishing commit statuses.
  checks: write
  statuses: write

concurrency:
  group: delivery-stages
  cancel-in-progress: false

jobs:
  enforce:
    name: ${{ github.event.pull_request.number && 'Delivery stages' || 'Reconcile delivery stages' }}
    if: github.event_name != 'issue_comment' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never execute PR code with a write token. Reviews are polled from main.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/delivery/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require the evaluated verdict for this PR
        if: github.event.pull_request.number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.PR_SHA;
          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            if (!response.ok) throw new Error(`Cannot verify delivery verdict: HTTP ${response.status}`);
            return response.json();
          }
          const pr = await get(`pulls/${process.env.PR_NUMBER}`);
          if (pr.state !== 'open' || pr.head.sha !== sha) throw new Error('PR changed during evaluation');
          const statuses = await get(`commits/${sha}/status?per_page=100`);
          if (statuses.total_count > 100) throw new Error('Too many statuses to verify');
          const status = statuses.statuses.find((s) => s.context === 'Delivery stages');
          if (status) {
            if (status.creator?.login !== 'github-actions[bot]' || status.state !== 'success') {
              throw new Error('Delivery status has not passed');
            }
          }
          // Before the publisher migration reaches main, the trusted evaluator
          // reports a synthetic check instead. Never read this job's own result.
          const checks = await get(`commits/${sha}/check-runs?check_name=Delivery%20stages&filter=latest&per_page=100`);
          if (checks.total_count > 100) throw new Error('Too many checks to verify');
          const legacy = checks.check_runs.filter((c) => c.name === 'Delivery stages' && c.head_sha === sha && c.app?.id === 15368 && !c.external_id);
          if (!status && legacy.length === 0) throw new Error('Delivery verdict is missing');
          if (legacy.some((c) => c.status !== 'completed' || c.conclusion !== 'success')) {
            throw new Error('Existing delivery check has not passed');
          }
          const current = await get(`pulls/${process.env.PR_NUMBER}`);
          if (current.state !== 'open' || current.head.sha !== sha) throw new Error('PR changed during verification');
          console.log(`Delivery verdict passed for #${pr.number} at ${sha}`);
          NODE
