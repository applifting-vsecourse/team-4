name: Agent code review

# Projects v2 has no workflow event for moving a card, so we poll the board.
# Scheduled workflows only run from the default branch.
on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Review and log only; no comments, card moves or review requests
        type: boolean
        default: true
      issue:
        description: Only process this issue number (empty = all)
        type: string
        default: ''
      force:
        description: Ignore earlier results for the same commit and review again
        type: boolean
        default: false

# One run at a time so two runs never review or move the same card twice.
concurrency:
  group: agent-code-review
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  checks: write
  statuses: write

jobs:
  review:
    if: (github.event_name != 'issue_comment' || github.actor != 'github-actions[bot]') && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always the default branch: the rules the agent reviews against come
      # from main, never from the PR under review, and PR code is never run.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The script has no dependencies; without this setup-node tries to
          # cache for pnpm (from packageManager) and fails as pnpm isn't installed.
          package-manager-cache: false

      - name: Review issues in Ready for Code Review
        run: node scripts/agent-review/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: 1 # "Kemp.io Team 4"
          # Scheduled runs are real runs; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ONLY_ISSUE: ${{ inputs.issue }}
          FORCE: ${{ inputs.force }}

      - name: Reconcile delivery verdicts
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: node scripts/delivery/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_ISSUE: ${{ inputs.issue }}
