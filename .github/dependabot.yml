version: 2
updates:
  - package-ecosystem: npm # Dependabot uses "npm" for pnpm workspaces and detects pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    labels: [dependencies, 'severity:standard']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      vitest-major:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      nestjs-major:
        patterns: ['@nestjs/*']
        update-types: [major]
      minor-and-patch:
        update-types: [minor, patch]
